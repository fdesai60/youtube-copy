<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:hover{
            color:green
        }
        .price{
            color:green
        }

        .button{
            padding:10px 30px;
            border-radius: 18px;  
            border:none;
            cursor: pointer;
        }

        .button.add{
            background-color: rgba(227, 227, 61, 0.7);
        }

        .button.add:hover{
            background-color: rgba(235, 218, 63,1);
        }
        .button.add:active{
            background-color: rgba(235, 218, 63,0.5);
        }

        .button.buy{
            background-color: rgb(255, 165, 0,0.7)
        }
        .button.buy:hover{
            background-color: rgba(255, 165, 0,1);
        }
        .button.buy:active{
            background-color: rgba(255, 165, 0,0.5);
        }

     
      


      
    </style>
</head>
<body>
    
<a href="https://amazon.com" target="_blank">back to amazon</a>
<h1>nike black running shoes</h1>
<p class="price">$39 - in stock.</p>
<p>free delivery tmrw</p>
<button class="button add">add to cart</button>
<button class="button buy">buy now</button>


</body>
</html>
